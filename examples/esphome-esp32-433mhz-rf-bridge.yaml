esphome:
  name: esp32-433mhz-rf-bridge
  friendly_name: ESP32 433 MHz RF Bridge

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

globals:
  - id: decoded_rf_code
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: rf_debug_status
    type: std::string
    restore_value: no
    initial_value: '"No reception"'
  - id: decoded_rf_code_valid
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_published_rf_code
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: last_published_rf_millis
    type: uint32_t
    restore_value: no
    initial_value: "0"

text_sensor:
  - platform: template
    id: bridge_api_version
    name: "Bridge API version"
    lambda: return {"2"};
    update_interval: 60s
    entity_category: diagnostic
  - platform: template
    id: rf_debug
    name: "RF debug"
    update_interval: never
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi signal"
    update_interval: 15s

api:
  encryption:
    key: !secret esp32_433mhz_rf_bridge_api_key

  actions:
    - action: transmit_rf
      variables:
        protocol: string
        code: string
      then:
        - script.execute:
            id: transmit_rf_command
            protocol: !lambda return protocol;
            code: !lambda return code;

    # V1 compatibility aliases. Remove only after every HA installation using
    # this bridge has migrated to the unified V2 action above.
    - action: send_nexa_rf_code
      variables:
        code: string
      then:
        - script.execute:
            id: transmit_rf_command
            protocol: "nexa"
            code: !lambda return code;

    - action: send_harju_rf_code
      variables:
        code: string
      then:
        - script.execute:
            id: transmit_rf_command
            protocol: "harju"
            code: !lambda return code;

script:
  - id: transmit_rf_command
    mode: queued
    max_runs: 16
    parameters:
      protocol: string
      code: string
    then:
      - if:
          condition:
            lambda: |-
              if (protocol != "nexa" || code.size() != 16) return false;
              for (char value : code) {
                if (!((value >= '0' && value <= '9') ||
                      (value >= 'A' && value <= 'F') ||
                      (value >= 'a' && value <= 'f'))) return false;
              }
              return true;
          then:
            - remote_transmitter.transmit_raw:
                code: !lambda |-
                  std::vector<int32_t> raw;
                  raw.push_back(260);
                  raw.push_back(-2890);
                  for (char c : code) {
                    uint8_t value = c <= '9'
                      ? c - '0'
                      : (c <= 'F' ? c - 'A' + 10 : c - 'a' + 10);
                    for (int bit = 3; bit >= 0; bit--) {
                      raw.push_back(230);
                      raw.push_back((value & (1 << bit)) ? -1440 : -350);
                    }
                  }
                  raw.push_back(230);
                  raw.push_back(-10100);
                  return raw;
                repeat:
                  times: 5
                  wait_time: 0ms
          else:
            - if:
                condition:
                  lambda: |-
                    if (protocol != "harju" || code.size() != 24) return false;
                    for (char value : code) {
                      if (value != '0' && value != '1') return false;
                    }
                    return true;
                then:
                  - remote_transmitter.transmit_rc_switch_raw:
                      code: !lambda return code;
                      protocol: 4
                      repeat:
                        times: 8
                        wait_time: 0ms
                else:
                  - logger.log:
                      level: ERROR
                      format: "Rejected RF command: unsupported protocol or invalid code"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 10dB

spi:
  clk_pin: GPIO4
  miso_pin: GPIO5
  mosi_pin: GPIO6

cc1101:
  id: cc1101_radio
  cs_pin: GPIO7
  frequency: 433.92MHz
  modulation_type: ASK/OOK

remote_receiver:
  # GPIO2 is intentional because the CC1101 is soldered to it.
  pin: GPIO2
  rmt_symbols: 48
  receive_symbols: 192

  on_raw:
    then:
      - lambda: |-
          id(decoded_rf_code_valid) = false;
          char status[96];
          snprintf(status, sizeof(status), "Raw pulses: %u", (unsigned) x.size());
          id(rf_debug_status) = std::string(status);

          if (x.size() < 128) {
            snprintf(status, sizeof(status), "Nexa: too short (%u pulses)",
                     (unsigned) x.size());
            id(rf_debug_status) = std::string(status);
            return;
          }

          size_t start = 0;
          int first_space = x[1] < 0 ? -x[1] : x[1];
          if (first_space > 2000) start = 2;
          if (x.size() - start < 128) {
            id(rf_debug_status) = "Nexa: incomplete frame after sync";
            return;
          }

          uint64_t decoded = 0;
          for (size_t bit = 0; bit < 64; bit++) {
            int mark = x[start + bit * 2];
            int space = x[start + bit * 2 + 1];
            mark = mark < 0 ? -mark : mark;
            space = space < 0 ? -space : space;

            if (mark < 100 || mark > 500) {
              snprintf(status, sizeof(status),
                       "Nexa: invalid mark at bit %u: %d us",
                       (unsigned) bit, mark);
              id(rf_debug_status) = std::string(status);
              return;
            }

            decoded <<= 1;
            if (space > 800 && space <= 1700) {
              decoded |= 1;
            } else if (space < 150 || space > 700) {
              snprintf(status, sizeof(status),
                       "Nexa: invalid space at bit %u: %d us",
                       (unsigned) bit, space);
              id(rf_debug_status) = std::string(status);
              return;
            }
          }

          char buffer[17];
          snprintf(buffer, sizeof(buffer), "%016llX",
                   (unsigned long long) decoded);
          id(decoded_rf_code) = std::string(buffer);

          const uint32_t now = millis();
          if (id(decoded_rf_code) == id(last_published_rf_code) &&
              now - id(last_published_rf_millis) < 250) {
            id(rf_debug_status) = "Nexa: duplicate repeat ignored";
            return;
          }

          id(last_published_rf_code) = id(decoded_rf_code);
          id(last_published_rf_millis) = now;
          id(decoded_rf_code_valid) = true;
          id(rf_debug_status) = "OK: " + id(decoded_rf_code);
      - text_sensor.template.publish:
          id: rf_debug
          state: !lambda return id(rf_debug_status);
      - if:
          condition:
            lambda: return id(decoded_rf_code_valid);
          then:
            - homeassistant.action:
                action: esp32_433mhz_rf_bridge.receive_code
                data_template:
                  code: "{{ code }}"
                variables:
                  code: !lambda return id(decoded_rf_code);

remote_transmitter:
  pin: GPIO3
  carrier_duty_percent: 100%
  rmt_symbols: 48
  non_blocking: false

  on_transmit:
    then:
      - cc1101.begin_tx: cc1101_radio

  on_complete:
    then:
      - cc1101.begin_rx: cc1101_radio
