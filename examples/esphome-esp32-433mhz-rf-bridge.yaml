esphome:
  name: esp32-433mhz-rf-bridge
  friendly_name: ESP32 433 MHz RF Bridge

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

globals:
  - id: decoded_rf_code
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: rf_debug_status
    type: std::string
    restore_value: no
    initial_value: '"No reception"'
  - id: decoded_rf_code_valid
    type: bool
    restore_value: no
    initial_value: "false"

text_sensor:
  - platform: template
    id: last_rf_code
    name: "Last RF code"
    update_interval: never
    entity_category: diagnostic
  - platform: template
    id: rf_debug
    name: "RF debug"
    update_interval: never
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi signal"
    update_interval: 15s

api:
  encryption:
    key: !secret esp32_433mhz_rf_bridge_api_key

  actions:
    - action: send_nexa_rf_code
      variables:
        code: string
      then:
        - remote_transmitter.transmit_raw:
            code: !lambda |-
              std::vector<int32_t> raw;
              raw.push_back(260);
              raw.push_back(-2890);

              for (char c : code) {
                uint8_t value;
                if (c >= '0' && c <= '9') {
                  value = c - '0';
                } else if (c >= 'A' && c <= 'F') {
                  value = c - 'A' + 10;
                } else if (c >= 'a' && c <= 'f') {
                  value = c - 'a' + 10;
                } else {
                  continue;
                }

                for (int bit = 3; bit >= 0; bit--) {
                  raw.push_back(230);
                  raw.push_back((value & (1 << bit)) ? -1440 : -350);
                }
              }

              raw.push_back(230);
              raw.push_back(-10100);
              return raw;
            repeat:
              times: 5
              wait_time: 0ms

    - action: send_harju_rf_code
      variables:
        code: string
      then:
        - remote_transmitter.transmit_rc_switch_raw:
            code: !lambda |-
              return code;
            protocol: 4
            repeat:
              times: 8
              wait_time: 0ms

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 10dB

spi:
  clk_pin: GPIO4
  miso_pin: GPIO5
  mosi_pin: GPIO6

cc1101:
  id: cc1101_radio
  cs_pin: GPIO7
  frequency: 433.92MHz
  modulation_type: ASK/OOK

remote_receiver:
  pin: GPIO2
  dump: all
  rmt_symbols: 48
  receive_symbols: 192

  on_raw:
    then:
      - lambda: |-
          id(decoded_rf_code_valid) = false;
          char status[96];
          snprintf(status, sizeof(status), "Raw pulses: %u", (unsigned) x.size());
          id(rf_debug_status) = std::string(status);

          auto abs_duration = [](int value) -> int {
            return value < 0 ? -value : value;
          };
          auto is_short = [](int value) -> bool {
            return value >= 150 && value <= 700;
          };
          auto is_long = [](int value) -> bool {
            return value >= 800 && value <= 1700;
          };
          auto is_sync_space = [](int value) -> bool {
            return value >= 1800 && value <= 3200;
          };

          // Harju remote repeats the same 24-bit frame several times. ESPHome's
          // rc_switch dump may report a minority fragment, so decode all raw
          // frames and use the most common one.
          if (x.size() >= 300) {
            std::vector<std::string> frames;
            for (size_t i = 0; i + 49 < x.size(); i += 2) {
              int sync_mark = abs_duration(x[i]);
              int sync_space = abs_duration(x[i + 1]);
              if (!is_short(sync_mark) || !is_sync_space(sync_space)) {
                continue;
              }

              std::string bits;
              bool ok = true;
              for (size_t bit = 0; bit < 24; bit++) {
                int mark = abs_duration(x[i + 2 + bit * 2]);
                int space = abs_duration(x[i + 3 + bit * 2]);
                if (is_long(mark) && is_short(space)) {
                  bits.push_back('1');
                } else if (is_short(mark) && is_long(space)) {
                  bits.push_back('0');
                } else {
                  ok = false;
                  break;
                }
              }

              if (ok) {
                frames.push_back(bits);
                i += 48;
              }
            }

            std::string best_code;
            size_t best_count = 0;
            for (const auto &candidate : frames) {
              size_t count = 0;
              for (const auto &other : frames) {
                if (other == candidate) {
                  count++;
                }
              }
              if (count > best_count) {
                best_code = candidate;
                best_count = count;
              }
            }

            if (best_count >= 2) {
              id(decoded_rf_code) = best_code;
              id(decoded_rf_code_valid) = true;
              snprintf(status, sizeof(status), "Harju raw: %s (%u/%u)",
                       best_code.c_str(), (unsigned) best_count,
                       (unsigned) frames.size());
              id(rf_debug_status) = std::string(status);
              return;
            }
          }

          if (x.size() < 128) {
            snprintf(status, sizeof(status), "Too short: %u pulses", (unsigned) x.size());
            id(rf_debug_status) = std::string(status);
            return;
          }

          size_t start = 0;
          int first_space = x[1] < 0 ? -x[1] : x[1];
          if (first_space > 2000) {
            start = 2;
          }
          if (x.size() - start < 128) {
            snprintf(status, sizeof(status), "Too short after sync: %u pulses", (unsigned) (x.size() - start));
            id(rf_debug_status) = std::string(status);
            return;
          }

          uint64_t code = 0;
          for (size_t bit = 0; bit < 64; bit++) {
            int mark = x[start + bit * 2];
            int space = x[start + bit * 2 + 1];
            mark = mark < 0 ? -mark : mark;
            space = space < 0 ? -space : space;

            if (mark < 100 || mark > 500) {
              if (bit == 0 && mark > 800) {
                id(rf_debug_status) = "RCSwitch code handled separately";
                return;
              }
              snprintf(status, sizeof(status), "Nexa: invalid mark at bit %u: %d us", (unsigned) bit, mark);
              id(rf_debug_status) = std::string(status);
              return;
            }

            code <<= 1;
            if (space > 800) {
              code |= 1;
            } else if (space < 150 || space > 700) {
              snprintf(status, sizeof(status), "Nexa: invalid space at bit %u: %d us", (unsigned) bit, space);
              id(rf_debug_status) = std::string(status);
              return;
            }
          }

          char buffer[17];
          snprintf(buffer, sizeof(buffer), "%016llX", (unsigned long long) code);
          id(decoded_rf_code) = std::string(buffer);
          id(decoded_rf_code_valid) = true;
          id(rf_debug_status) = "OK: " + id(decoded_rf_code);
      - text_sensor.template.publish:
          id: rf_debug
          state: !lambda "return id(rf_debug_status);"
      - if:
          condition:
            lambda: "return id(decoded_rf_code_valid);"
          then:
            - text_sensor.template.publish:
                id: last_rf_code
                state: !lambda |-
                  return id(decoded_rf_code) + " @ " + std::to_string(millis());
            - homeassistant.action:
                action: esp32_433mhz_rf_bridge.receive_code
                data_template:
                  code: "{{ code }}"
                variables:
                  code: !lambda |-
                    return id(decoded_rf_code);

remote_transmitter:
  pin: GPIO3
  carrier_duty_percent: 100%
  rmt_symbols: 48
  non_blocking: true

  on_transmit:
    then:
      - cc1101.begin_tx: cc1101_radio

  on_complete:
    then:
      - cc1101.begin_rx: cc1101_radio
